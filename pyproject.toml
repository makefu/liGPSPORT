[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "ligpsport"
version = "1.2.0"
description = "Python BLE interface for iGPSPORT cycling computers (BSC200 family)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ligpsport contributors" }]
dependencies = [
    "bleak>=0.22",
    "protobuf>=4.25",
    "dbus-fast>=2.0; sys_platform == 'linux'",
]

[project.scripts]
ligpsport = "ligpsport.__main__:main"

[tool.setuptools.packages.find]
include = ["ligpsport*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The "bsc200" marker selects live-device tests; the build excludes them
# from `nix build .#default`. Set LIGPSPORT_DEVICE_ADDRESS and pass
# `-m bsc200` explicitly to opt in.
addopts = "-ra -m 'not bsc200'"
asyncio_mode = "auto"
markers = [
    "bsc200: live-device test requiring LIGPSPORT_DEVICE_ADDRESS env var",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Generated protobuf modules: not our code, regenerated by
# `nix run .#gen-proto`. Linting them would just create churn and
# would force us to edit autogen output, which AGENTS.md forbids.
extend-exclude = ["ligpsport/proto"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
# Generated protobuf modules don't type-check cleanly with --strict
[[tool.mypy.overrides]]
module = "ligpsport.proto.*"
ignore_errors = true
